---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - federation-ai.open-cluster-management.io.open-cluster-management.io
  resources:
  - federatedlearnings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - federation-ai.open-cluster-management.io.open-cluster-management.io
  resources:
  - federatedlearnings/finalizers
  verbs:
  - update
- apiGroups:
  - federation-ai.open-cluster-management.io.open-cluster-management.io
  resources:
  - federatedlearnings/status
  verbs:
  - get
  - patch
  - update
